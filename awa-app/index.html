<script>
  // Drag to scroll with a mouse, like swiping on a phone (touch screens already scroll natively).
  (function () {
    var el = null, startY = 0, startTop = 0, moved = false;
    function scroller(node) {
      for (; node && node !== document.body; node = node.parentElement) {
        var s = getComputedStyle(node);
        if (/(auto|scroll)/.test(s.overflowY) && node.scrollHeight > node.clientHeight) return node;
      }
      return null;
    }
    window.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      el = scroller(e.target); moved = false;
      if (el) { startY = e.clientY; startTop = el.scrollTop; }
    }, true);
    window.addEventListener('pointermove', function (e) {
      if (!el) return;
      var dy = e.clientY - startY;
      if (Math.abs(dy) > 4) moved = true;
      if (moved) el.scrollTop = startTop - dy;
    }, true);
    window.addEventListener('pointerup', function () { el = null; }, true);
    // A drag isn't a tap: swallow the click that follows it.
    window.addEventListener('click', function (e) {
      if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
  })();
</script>
